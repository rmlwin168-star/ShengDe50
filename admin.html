<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖德宮50周年慶 - 後台管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Noto Sans TC', sans-serif; background-color: #F3F4F6; } </style>
</head>
<body class="antialiased flex h-screen overflow-hidden">

    <script>
        // 🚨 務必換成您新帳號重新發布的 API 網址
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbw-DKhRuntIjremIcCzhn97M45gIH3kaqSTx0FVUp4LWZDwHi8J2szgQK1zZFTTnTUb/exec';
        let globalRecords = [];

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('status-msg').textContent = "資料載入中...";
            try {
                const response = await fetch(scriptUrl);
                const records = await response.json();
                
                // 去重邏輯 (保留最新)
                const latestMap = new Map();
                records.forEach(row => latestMap.set(`${row.temple}_${row.name}`, row));
                globalRecords = Array.from(latestMap.values()).filter(r => r.job !== '❌ 不克出席 (取消)');
                
                document.getElementById('status-msg').textContent = `✅ 載入成功，共 ${globalRecords.length} 筆有效報名`;
            } catch (e) {
                document.getElementById('status-msg').textContent = "❌ 資料載入失敗";
            }
        });
    </script>

    <!-- 側邊導覽列 Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col shadow-xl z-20 hidden md:flex">
        <div class="p-6 border-b border-gray-800">
            <h1 class="text-xl font-bold text-amber-400 tracking-wide">聖德宮 50周年</h1>
            <p class="text-xs text-gray-400 mt-1">大會後台管理中心</p>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <button class="w-full text-left px-4 py-3 rounded-xl bg-amber-600 text-white font-bold shadow-md">
                📊 大會總覽與便當
            </button>
            <button class="w-full text-left px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white font-bold transition-all">
                🚗 交通與停車位配置
            </button>
            <button class="w-full text-left px-4 py-3 rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white font-bold transition-all">
                🪑 巡禮與展演座位表
            </button>
        </nav>
        <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center">
            限大會籌備委員使用
        </div>
    </aside>

    <!-- 主要內容區 Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-y-auto">
        <header class="bg-white shadow-sm px-8 py-5 flex justify-between items-center z-10 sticky top-0">
            <h2 class="text-2xl font-bold text-gray-800">大會總覽與物料結算</h2>
            <div id="status-msg" class="text-sm font-bold text-amber-700 bg-amber-50 px-4 py-2 rounded-full border border-amber-200">
                等待連線中...
            </div>
        </header>

        <div class="p-8">
            <div class="bg-white p-10 rounded-2xl shadow-sm border border-gray-200 text-center">
                <h3 class="text-gray-500 font-bold mb-2">後台系統已成功建立</h3>
                <p class="text-sm text-gray-400">目前資料庫連線已接通。請告訴我您希望先實作哪一個後台報表？<br>(例如：便當總表計算、停車區劃分，或排座位清單)</p>
            </div>
        </div>
    </main>

</body>
</html>
